tool: fast-check
label: "fast-check"
language: typescript
node_version: "20"
typescript_version: "5.9.3"
branch: "TS-101"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "pnpm"
bundler: "esbuild"
project: package.json
tests: tests/
tools_project: tools/
pinned-version: "4.9.0"
config: "tools/mocha/.mocharc.cjs"
target_files: [tests/property.spec.ts]
command: "node_modules/.bin/mocha --config tools/mocha/.mocharc.cjs --grep 'properties'"
produces: "property-based test results, 200 runs per property"

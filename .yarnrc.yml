# Yarn Berry 4.18.0.
#
# nodeLinker: node-modules is a DELIBERATE choice, not a default. Berry's
# Plug'n'Play linker breaks tools that resolve modules from disk, and this
# repository exists to have its tools actually run. Under PnP, jscpd, madge,
# dependency-cruiser and stryker cannot resolve the project. The trade-off is
# recorded in the README.
nodeLinker: node-modules

# No yarnPath: the version is pinned by `packageManager: yarn@4.18.0` in
# package.json, which corepack honours. That avoids committing a ~2MB release
# binary while still pinning the manager exactly.
# Resolve through the npm registry directly. registry.yarnpkg.com is a CNAME
# that does not resolve behind every proxy, and Berry defaults to it.
npmRegistryServer: "https://registry.npmjs.org"

enableGlobalCache: false
compressionLevel: mixed
